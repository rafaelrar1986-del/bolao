name: Apply Extras alignment

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append scoring Extras alignment CSS
        run: |
          cat >> css/styles4.css <<'EOF'

/* v29.1 — Regras de Pontuação: Extras alinhados */
#scoring-rules-modal .form-row:has(#sr-topScorer) {
  display: grid !important;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  align-items: start;
}
#scoring-rules-modal .form-row:has(#sr-topScorer) .form-group {
  min-width: 0;
  width: 100%;
  margin: 0;
  display: flex;
  flex-direction: column;
}
#scoring-rules-modal .form-row:has(#sr-topScorer) .form-group label {
  display: flex;
  align-items: flex-start;
  min-height: 48px;
  margin: 0 0 6px;
  line-height: 1.35;
}
#scoring-rules-modal .form-row:has(#sr-topScorer) .form-group input {
  width: 100% !important;
  min-width: 0;
  height: 42px;
  box-sizing: border-box;
}
@media (max-width: 600px) {
  #scoring-rules-modal .form-row:has(#sr-topScorer) {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px;
  }
  #scoring-rules-modal .form-row:has(#sr-topScorer) .form-group label {
    min-height: 52px;
    font-size: 14px;
  }
}
@media (max-width: 380px) {
  #scoring-rules-modal .form-row:has(#sr-topScorer) {
    gap: 6px;
  }
  #scoring-rules-modal .form-row:has(#sr-topScorer) .form-group label {
    font-size: 12px;
  }
}
EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add css/styles4.css
          git diff --cached --quiet || git commit -m "Fix Admin scoring Extras alignment"
          git push
